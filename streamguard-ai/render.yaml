services:
  # Backend FastAPI Service
  - type: web
    name: flowshield-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowshield-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: RESEND_API_KEY
        sync: false # You will add this manually in the Render dashboard
      - key: CORS_ORIGINS
        value: "*" # We will sharpen this once we have the Vercel link

databases:
  - name: flowshield-db
    plan: free
    region: ohio
