services:
  # Backend FastAPI Service
  - type: web
    name: flowshield-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT"
    plan: free
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowshield-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: RESEND_API_KEY
        sync: false # You will add this manually in the Render dashboard
      - key: CORS_ORIGINS
        value: "*" # We will sharpen this once we have the Vercel link

databases:
  - name: flowshield-db
    plan: free
    region: ohio
