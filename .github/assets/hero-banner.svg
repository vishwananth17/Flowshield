<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Flowshield AI Hero Banner">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="50%" stop-color="#0C1425"/>
      <stop offset="100%" stop-color="#14213D"/>
    </linearGradient>

    <linearGradient id="gold-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7C24"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF0B3"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7C24"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-400 0" to="800 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>

    <style>
      @keyframes particleFlow {
        0% { transform: translateX(0px); opacity: 0.1; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateX(380px); opacity: 0.1; }
      }
      .particle {
        animation: particleFlow 3s infinite linear;
      }
      @keyframes pulseShield {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #D4AF37); }
        100% { transform: scale(1); opacity: 0.8; }
      }
      .shield-icon {
        transform-origin: 600px 180px;
        animation: pulseShield 2.5s infinite ease-in-out;
      }
      @keyframes countScore {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes revealBlocked {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes slideLatency {
        0% { opacity: 0; transform: translateX(20px); }
        100% { opacity: 1; transform: translateX(0px); }
      }
      .score-text { animation: countScore 1s forwards ease-out; }
      .blocked-badge { animation: revealBlocked 0.6s 1.2s forwards ease-out; opacity: 0; }
      .latency-badge { animation: slideLatency 0.5s 1.8s forwards ease-out; opacity: 0; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Left: Branding & Tagline -->
  <text x="70" y="160" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="46" font-weight="800" fill="url(#gold-shimmer)" filter="url(#gold-glow)">Flowshield AI</text>
  <text x="70" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94A3B8">Sovereign Real-Time Fraud Defense</text>
  <text x="70" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748B">Sub-50ms Hybrid ML &amp; Automated Chargeback Engine</text>

  <!-- Center: Flow Data Pipeline Visual -->
  <g transform="translate(420, 180)">
    <line x1="0" y1="0" x2="360" y2="0" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>
    <circle cx="20" cy="0" r="3" fill="#D4AF37" class="particle" style="animation-delay: 0s;"/>
    <circle cx="60" cy="0" r="4" fill="#3B82F6" class="particle" style="animation-delay: 0.5s;"/>
    <circle cx="100" cy="0" r="3" fill="#D4AF37" class="particle" style="animation-delay: 1s;"/>
    <circle cx="150" cy="0" r="5" fill="#EF4444" class="particle" style="animation-delay: 1.5s;"/>
    <circle cx="200" cy="0" r="3.5" fill="#10B981" class="particle" style="animation-delay: 2s;"/>
    <circle cx="270" cy="0" r="4" fill="#D4AF37" class="particle" style="animation-delay: 2.5s;"/>
  </g>

  <!-- Center Icon: Pulsing Shield -->
  <g class="shield-icon">
    <path d="M 600 135 L 635 152 V 192 C 635 215 600 230 600 230 C 600 230 565 215 565 192 V 152 Z" fill="#0C1425" stroke="url(#gold-shimmer)" stroke-width="3.5" filter="url(#gold-glow)"/>
    <path d="M 592 182 L 599 189 L 612 174" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Real-Time Telemetry Decision Panel -->
  <g transform="translate(830, 95)">
    <!-- Terminal Window Frame -->
    <rect width="300" height="190" rx="12" fill="#090E1A" stroke="#1E293B" stroke-width="2"/>
    <rect width="300" height="32" rx="12" fill="#131C2E"/>
    <circle cx="22" cy="16" r="5" fill="#EF4444"/>
    <circle cx="38" cy="16" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="16" r="5" fill="#10B981"/>
    <text x="150" y="21" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">telemetry.inference</text>

    <!-- Code Telemetry Payload -->
    <text x="24" y="66" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">risk_score:</text>
    <text x="130" y="66" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#EF4444" class="score-text">0.9400</text>

    <text x="24" y="105" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">decision:</text>
    <g class="blocked-badge" transform="translate(130, 88)">
      <rect width="90" height="24" rx="6" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="45" y="16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#EF4444" text-anchor="middle" filter="url(#red-glow)">BLOCKED</text>
    </g>

    <text x="24" y="146" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">latency:</text>
    <g class="latency-badge" transform="translate(130, 130)">
      <rect width="70" height="22" rx="5" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="35" y="15" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">43ms</text>
    </g>
  </g>

  <!-- Bottom Bar: Tech Stack Integration Icons -->
  <g transform="translate(70, 325)">
    <rect width="1060" height="42" rx="8" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
    <text x="30" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1">STACK ENTITLEMENTS</text>

    <text x="250" y="26" font-family="monospace" font-size="13" fill="#3178C6">TypeScript</text>
    <circle cx="340" cy="22" r="2" fill="#334155"/>

    <text x="370" y="26" font-family="monospace" font-size="13" fill="#009688">FastAPI</text>
    <circle cx="450" cy="22" r="2" fill="#334155"/>

    <text x="480" y="26" font-family="monospace" font-size="13" fill="#D4AF37">XGBoost ML</text>
    <circle cx="580" cy="22" r="2" fill="#334155"/>

    <text x="610" y="26" font-family="monospace" font-size="13" fill="#4169E1">PostgreSQL</text>
    <circle cx="710" cy="22" r="2" fill="#334155"/>

    <text x="740" y="26" font-family="monospace" font-size="13" fill="#DC382D">Redis</text>
    <circle cx="810" cy="22" r="2" fill="#334155"/>

    <text x="840" y="26" font-family="monospace" font-size="13" fill="#10B981">Resend Email</text>
    <circle cx="950" cy="22" r="2" fill="#334155"/>

    <text x="980" y="26" font-family="monospace" font-size="13" fill="#61DAFB">React 19</text>
  </g>
</svg>
