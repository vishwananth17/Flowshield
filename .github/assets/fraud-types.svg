<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Fraud Types Detected by Flowshield AI">
  <defs>
    <style>
      @keyframes rotateDonut {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .donut-group {
        transform-origin: 250px 250px;
        animation: rotateDonut 120s linear infinite;
      }
      @keyframes strokeDraw {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      .arc-segment {
        stroke-dasharray: 400;
        animation: strokeDraw 2s forwards ease-out;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="16" fill="#060B18" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Radial Donut Ring -->
  <g class="donut-group">
    <!-- Stolen Card 21% (Blue) -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#3B82F6" stroke-width="32" stroke-dasharray="184 695" stroke-dashoffset="0" class="arc-segment"/>
    
    <!-- Chargeback Fraud 19% (Amber) -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#F59E0B" stroke-width="32" stroke-dasharray="167 695" stroke-dashoffset="-190" class="arc-segment"/>

    <!-- Account Takeover 16% (Purple) -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#8B5CF6" stroke-width="32" stroke-dasharray="140 695" stroke-dashoffset="-362" class="arc-segment"/>

    <!-- Promo Abuse 16% (Cyan) -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#06B6D4" stroke-width="32" stroke-dasharray="140 695" stroke-dashoffset="-507" class="arc-segment"/>

    <!-- Refund Fraud 15% (Pink) -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#EC4899" stroke-width="32" stroke-dasharray="131 695" stroke-dashoffset="-652" class="arc-segment"/>

    <!-- Bot Attack 13% (Red) -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#EF4444" stroke-width="32" stroke-dasharray="114 695" stroke-dashoffset="-788" class="arc-segment"/>
  </g>

  <!-- Center Label -->
  <circle cx="250" cy="250" r="110" fill="#090E1A" stroke="#1E293B" stroke-width="2"/>
  <text x="250" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle">6 FRAUD</text>
  <text x="250" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#D4AF37" text-anchor="middle">TYPES</text>
  <text x="250" y="288" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">DETECTED</text>

  <!-- External Callout Labels -->
  <!-- 1. Stolen Card (Top Right) -->
  <text x="410" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#3B82F6">Stolen Card 21%</text>
  <line x1="340" y1="130" x2="400" y2="85" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 2. Chargeback Fraud (Right) -->
  <text x="420" y="255" font-family="sans-serif" font-size="12" font-weight="700" fill="#F59E0B">Chargeback 19%</text>
  <line x1="390" y1="250" x2="415" y2="250" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 3. Account Takeover (Bottom Right) -->
  <text x="390" y="430" font-family="sans-serif" font-size="12" font-weight="700" fill="#8B5CF6">Takeover 16%</text>
  <line x1="340" y1="370" x2="385" y2="420" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 4. Promo Abuse (Bottom Left) -->
  <text x="30" y="430" font-family="sans-serif" font-size="12" font-weight="700" fill="#06B6D4">Promo Abuse 16%</text>
  <line x1="160" y1="370" x2="115" y2="420" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 5. Refund Fraud (Left) -->
  <text x="20" y="255" font-family="sans-serif" font-size="12" font-weight="700" fill="#EC4899">Refund Fraud 15%</text>
  <line x1="110" y1="250" x2="135" y2="250" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 6. Bot Attack (Top Left) -->
  <text x="30" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#EF4444">Bot Attack 13%</text>
  <line x1="160" y1="130" x2="105" y2="85" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
